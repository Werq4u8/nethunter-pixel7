name: Build NetHunter Kernel for Pixel 7 (Android 16)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-docker-images: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python3-pip

      - name: Install Repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize and Sync Kernel Source (Pixel 7 / Android 16)
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-pantah-6.1-android16

          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --optimized-fetch

      - name: Patch Kernel config for NetHunter
        run: |
          cd workspace

          # Находим правильный gki_defconfig (в подпапке aosp)
          GKI_CONFIG=$(find . -name "gki_defconfig" -type f 2>/dev/null | head -1)

          if [ -z "$GKI_CONFIG" ]; then
            echo "ОШИБКА: gki_defconfig не найден!"
            exit 1
          fi

          echo "=== Патчим gki_defconfig: $GKI_CONFIG ==="
          chmod +w "$GKI_CONFIG"

          # Включаем сетевые подсистемы и инъекцию пакетов
          echo "CONFIG_CFG80211=m"          >> "$GKI_CONFIG"
          echo "CONFIG_MAC80211=m"           >> "$GKI_CONFIG"
          echo "CONFIG_MAC80211_INJECT=y"    >> "$GKI_CONFIG"

          # Поддержка HID / BadUSB клавиатуры
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> "$GKI_CONFIG"

          # Серийные порты и вспомогательные сетевые драйверы
          echo "CONFIG_USB_SERIAL=y"         >> "$GKI_CONFIG"
          echo "CONFIG_USB_SERIAL_GENERIC=y" >> "$GKI_CONFIG"

          echo "=== gki_defconfig успешно обновлен ==="

      - name: Build Kernel (Bazel / Kleaf)
        run: |
          cd workspace

          # --nocheck_defconfig отключает строгую проверку несовпадающих символов в Kleaf
          tools/bazel run \
            --config=pantah \
            --nocheck_defconfig \
            //private/devices/google/pantah:gs201_pantah_dist \
            --local_ram_resources=8192 \
            --local_cpu_resources=4 \
            -- \
            --dist_dir=out/dist

          echo "=== Содержимое out/dist (или out/pantah/dist): ==="
          ls -lh out/dist/ 2>/dev/null || ls -lh out/pantah/dist/ 2>/dev/null || find out/ -type f

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-boot-img-Pixel7-Android16
          path: workspace/out/**/boot.img
          retention-days: 7

      - name: Upload vendor images (.img)
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-vendor-images-Pixel7-Android16
          path: |
            workspace/out/**/dtb.img
            workspace/out/**/vendor_boot.img
            workspace/out/**/vendor_kernel_boot.img
          retention-days: 7
        continue-on-error: true

      - name: Upload kernel modules (.ko)
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-kernel-modules-Pixel7-Android16
          path: workspace/out/**/*.ko
          retention-days: 7
        continue-on-error: true
