name: Build NetHunter Kernel for Pixel 7 (Android 16 CP1A 6.1.145)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "=== Диск до очистки: ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          echo "=== Диск после очистки: ==="
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core curl build-essential zip unzip \
            python3 python3-pip flex bison libssl-dev bc

      - name: Install Repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize and Sync Kernel Source (Pixel 7 / Android 16)
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b android-gs-pantah-6.1-android16-beta

          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --optimized-fetch

      - name: Checkout exact kernel commit matching CP1A (6.1.145)
        run: |
          cd workspace/aosp
          echo "=== Подтягиваем тег android14-6.1-2025-09_r22 (коммит fa1d6308d1fe) ==="
          git fetch --depth=1 https://android.googlesource.com/kernel/common refs/tags/android14-6.1-2025-09_r22:refs/tags/cp1a_tag
          git checkout cp1a_tag
          echo "=== Успешно переключено на коммит: ==="
          git log -1 --oneline

      - name: Patch Kernel config for NetHunter
        run: |
          cd workspace

          # Находим правильный gki_defconfig (в aosp)
          GKI_CONFIG=$(find . -name "gki_defconfig" -type f 2>/dev/null | head -1)

          if [ -z "$GKI_CONFIG" ]; then
            echo "ОШИБКА: gki_defconfig не найден!"
            exit 1
          fi

          echo "=== Патчим gki_defconfig: $GKI_CONFIG ==="
          chmod +w "$GKI_CONFIG"

          # Включаем мониторный режим и packet injection
          echo "CONFIG_CFG80211=m"       >> "$GKI_CONFIG"
          echo "CONFIG_MAC80211=m"      >> "$GKI_CONFIG"
          echo "CONFIG_MAC80211_INJECT=y" >> "$GKI_CONFIG"

          # Отключаем устаревший rtl8150 чтобы избежать ошибки modpost usb_check_int_endpoints
          echo "CONFIG_USB_RTL8150=n" >> "$GKI_CONFIG"

          echo "=== gki_defconfig успешно обновлен ==="

      - name: Build Kernel from Source (Bazel / Kleaf)
        run: |
          cd workspace

          echo "=== Отключаем prebuilt GKI во всех bazelrc ==="
          find . -name "*.bazelrc" -exec sed -i 's/build --use_prebuilt_gki=true/build --use_prebuilt_gki=false/g' {} + || true
          find . -name "*.bazelrc" -exec sed -i 's/build --use_signed_prebuilts=true/build --use_signed_prebuilts=false/g' {} + || true
          find . -name "*.bazelrc" -exec sed -i 's/build --download_prebuilt_gki_fips140=true/build --download_prebuilt_gki_fips140=false/g' {} + || true

          tools/bazel run \
            --config=pantah \
            --use_prebuilt_gki=false \
            --use_signed_prebuilts=false \
            --download_prebuilt_gki_fips140=false \
            --notrim \
            --nokmi_symbol_list_violations_check \
            --nokmi_symbol_list_strict_mode \
            //private/devices/google/pantah:gs201_pantah_dist \
            --local_ram_resources=8192 \
            --local_cpu_resources=4 \
            -- \
            --dist_dir=out/dist

          echo "=== Проверяем версию собранного ядра в out/dist/Image ==="
          strings out/dist/Image | grep -E "Linux version [0-9]" | head -2 || true

      - name: Package Artifacts Cleanly
        run: |
          mkdir -p package/images package/modules
          
          # Копируем образы разделов из out/dist
          cp workspace/out/dist/boot.img package/images/ || true
          cp workspace/out/dist/dtb.img package/images/ || true
          cp workspace/out/dist/vendor_kernel_boot.img package/images/ || true
          cp workspace/out/dist/vendor_boot.img package/images/ || true

          # Копируем модули (.ko) и пакуем в плоский ZIP для Windows
          cp workspace/out/dist/*.ko package/modules/ || true
          cd package/modules
          zip -r ../nethunter-modules-cp1a-6.1.145.zip *.ko
          cd ../..

      - name: Upload Boot & Vendor Images
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Images-Pixel7-Android16-CP1A-6.1.145
          path: package/images/*
          retention-days: 7

      - name: Upload Kernel Modules (Clean ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Modules-Pixel7-Android16-CP1A-6.1.145
          path: package/nethunter-modules-cp1a-6.1.145.zip
          retention-days: 7
